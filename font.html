<!DOCTYPE html>
<html>
    <head>
        <title>Font</title>
    </head>
    <body>
        <p><font face="Arial">Ini adalah teks dengan font Arial</font></p>
        <p><font face="Arial"><i>Ini adalah teks dengan font Arial dan miring </i></font></p>
        <p><font face="verdana" size="4" color="red">
            <b>Ini adalah teks dengan font verdana, ukuran 4 dan berwarna merah tebal</b>
        </font></p>
        <p align="center"><font face="Arial" color="blue">
            <b>Ini adalah teks yang berada di tengah,berwarna biru tebal</b>
        </font></p>
        <p align="center"><font face="Arial" color="red"> Ini Font Arial merah, </font>
            <font face="Verdana" color="blue">ini Font Verdana biru</font></p>
</body>
</html>
