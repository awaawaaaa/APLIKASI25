<!DOCTYPE html>
<html>

<head>
    <title>Atribut dari Tag IMG</title>
</head>

<body>
    <p><b>Tag img hanya dengan atribut src</b></p>
    <img src="e-book.png">
    <p><b>Tag img dengan border="1"</b></p>
    <img src="e-book.png" border="1">
    <p><b>Tag img dengan height dan width</b></p>
    <img src="e-book.png" border="1" height="300" width="200">
</body>

</html>
